name: Deploy Fastify App

on:
  push:
    branches: ['master'] # ganti 'main' kalau perlu
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "📁 Go to project"
            cd /srv/backend

            echo "🔄 Pull latest code"
            git pull

            echo "📦 Install dependencies"
            npm install

            echo "🏗 Build TypeScript"
            npm run build

            echo "🚀 Start app with PM2 (memory limit 300MB)"
            pm2 start npm --name backend --max-memory-restart 300M -- start || pm2 restart backend

            echo "💾 Save PM2 state"
            pm2 save

            echo "✅ DONE "
