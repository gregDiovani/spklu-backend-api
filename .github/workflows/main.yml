name: Deploy Fastify App

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin

            echo "📁 Go to project"
            cd /srv/backend

            echo "📦 Install dependencies"
            npm ci --only=production

            echo "🏗 Build TypeScript"
            npm run build

            echo "🧪 Check build output"
            if [ ! -f "dist/index.js" ]; then
              echo "❌ Build failed — dist/index.js not found"
              exit 1
            fi

            echo "🚀 Reload PM2 using ecosystem"
            pm2 start ecosystem.config.js --update-env || true
            pm2 reload ecosystem.config.js --update-env || true

            echo "💾 Save PM2 state"
            pm2 save

            echo "✅ DONE"
